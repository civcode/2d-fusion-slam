services:
  demo:
    build:
      context: .
      target: demo
      args:
        SLAM_DOCKER_JOBS: ${SLAM_DOCKER_JOBS:-2}
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./apps/demo/maps:/maps:ro
    init: true
    restart: "no"

  # Explicit opt-in only: docker compose run --build --rm test
  test:
    profiles: ["test"]
    build:
      context: .
      target: test
      args:
        SLAM_DOCKER_JOBS: ${SLAM_DOCKER_JOBS:-2}
    environment:
      CTEST_PARALLEL_LEVEL: ${SLAM_DOCKER_JOBS:-2}
    init: true
    restart: "no"
