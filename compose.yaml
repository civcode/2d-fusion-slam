services:
  demo:
    build:
      context: .
      target: demo
      args:
        SLAM_DOCKER_JOBS: ${SLAM_DOCKER_JOBS:-28}
    ports:
      - "127.0.0.1:${SLAM_DEMO_PORT:-8765}:8765"
    volumes:
      - ./apps/demo/maps:/maps:ro
      # Point at a completed sweep to browse all its runs directly.
      # No files are copied and the native server remains read-only.
      - ${FUSION_DEMO_RUNS_DIR:-./apps/demo/fusion}:/fusion:ro
    init: true
    restart: "no"

  # Explicit opt-in only: docker compose run --build --rm test
  test:
    profiles: ["test"]
    build:
      context: .
      target: test
      args:
        SLAM_DOCKER_JOBS: ${SLAM_DOCKER_JOBS:-28}
        SLAM_PROFILE_FUSION: ${SLAM_PROFILE_FUSION:-ON}
    environment:
      # Build jobs and test concurrency are intentionally independent.
      CTEST_PARALLEL_LEVEL: ${SLAM_CTEST_JOBS:-2}
    init: true
    restart: "no"
